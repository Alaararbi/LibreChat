# Memory configuration for user memories (مُفعّلة الآن)
memory:
  disabled: false
  validKeys: ['preferences', 'work_info', 'personal_info', 'skills', 'interests', 'context']
  tokenLimit: 10000
  maxInputTokens: 12000
  personalize: true
  agent:
    enabled: true
    provider: 'OpenRouter'
    model: 'openrouter/free'
