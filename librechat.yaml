# ===========================================
# Memory - مع تفعيل memory.agent
# ===========================================
memory:
  disabled: false
  validKeys: ['preferences', 'work_info', 'personal_info', 'skills', 'interests', 'context', 'project_details', 'technical_stack', 'coding_preferences', 'business_goals']
  tokenLimit: 50000
  charLimit: 15000
  maxInputTokens: 20000
  personalize: true
  messageWindowSize: 10
  # ✅ تم تفعيل memory.agent (enabled: true)
  agent:
    enabled: true
    provider: 'OpenRouter'
    model: 'nvidia/nemotron-3-super-120b-a12b:free'
    instructions: >
      لكل فئة، اتبع هذي القاعدة الدقيقة:
      - project_details: احفظ اسم المشروع، بنيته التقنية، القرارات المعمارية المتخذة.
      - technical_stack: احفظ كل تقنية/خدمة يذكرها المستخدم يستخدمها فعليًا (Render, MongoDB, إلخ).
      - coding_preferences: احفظ أسلوبه المفضل (شرح مفصل، خطوة بخطوة، بدون تعقيد).
      - business_goals: احفظ أي هدف طويل المدى يذكره (دخل، مشاريع مستقبلية).
      - personal_info: احفظ الاسم، اللغة المفضلة، أي معلومة شخصية يشاركها.
      - preferences: احفظ تفضيلات عامة (مثل تفضيل العربي، تفضيل الإجابات القصيرة).
      - work_info: احفظ أي معلومة متعلقة بالعمل أو الدراسة.
      - skills: احفظ المهارات المذكورة للمستخدم أو التي يطلب تعلمها.
      - interests: احفظ الاهتمامات والهوايات.
      - context: احفظ السياق الحالي للمحادثة (المشروع الذي يعمل عليه، الهدف الحالي).
      احذف أي معلومة تصبح قديمة أو متجاوزة عندما يذكر المستخدم تحديثًا لها صراحة.
    model_parameters:
      temperature: 0.2

# البحث في الويب - مجاني بالكامل
webSearch:
  searchProvider: keenable
  scraperProvider: keenable
  rerankerType: none
  keenableSearchOptions:
    maxResults: 5

# تتبع استهلاك النماذج
balance:
  enabled: true
  startBalance: 1000000
  autoRefillEnabled: true
  refillIntervalValue: 1
  refillIntervalUnit: 'days'
  refillAmount: 1000000
